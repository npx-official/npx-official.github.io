<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact • NIGHT PULSE X</title>
    <link rel="icon" href="assets/images/favicon.ico" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0f;
            color: #e0e5f0;
            font-family: 'Segoe UI', system-ui, sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
        }
        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            background: 
                radial-gradient(ellipse at 20% 50%, rgba(111, 255, 224, 0.05), transparent 50%),
                radial-gradient(ellipse at 80% 50%, rgba(124, 58, 237, 0.05), transparent 50%);
            animation: bgMove 10s ease-in-out infinite alternate;
        }
        @keyframes bgMove {
            0% { transform: scale(1) rotate(0deg); }
            100% { transform: scale(1.1) rotate(3deg); }
        }
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }
        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle var(--d) ease-in-out infinite alternate;
        }
        @keyframes twinkle {
            0% { opacity: 0.1; transform: scale(0.5); }
            100% { opacity: 1; transform: scale(1.5); }
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem 3rem;
            position: relative;
            z-index: 1;
        }
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1rem 2rem;
            background: rgba(10, 10, 15, 0.6);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(111, 255, 224, 0.08);
            border-radius: 2rem;
            margin-bottom: 4rem;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #6fffe0, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .logo img { width: 40px; height: 40px; }
        .nav a {
            color: rgba(255,255,255,0.5);
            text-decoration: none;
            margin-left: 2rem;
            font-size: 0.95rem;
            transition: 0.3s;
            position: relative;
        }
        .nav a::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 0;
            width: 0;
            height: 2px;
            background: #6fffe0;
            transition: 0.3s;
        }
        .nav a:hover { color: #fff; }
        .nav a:hover::after { width: 100%; }
        .nav a.active { color: #fff; }
        .nav a.active::after { width: 100%; }
        .nav a i { margin-right: 6px; }

        .page-title {
            font-size: 2.8rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 2.5rem;
            background: linear-gradient(135deg, #6fffe0, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        .contact-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 2rem;
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(111, 255, 224, 0.06);
            border-radius: 1.5rem;
            padding: 2rem;
        }
        .contact-form {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .contact-form input,
        .contact-form textarea {
            padding: 0.8rem 1.2rem;
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(111, 255, 224, 0.06);
            border-radius: 1rem;
            color: #e0e5f0;
            font-family: inherit;
            transition: 0.3s;
        }
        .contact-form input:focus,
        .contact-form textarea:focus {
            outline: none;
            border-color: #6fffe0;
            box-shadow: 0 0 20px rgba(111, 255, 224, 0.05);
        }
        .btn {
            padding: 0.8rem 2rem;
            border-radius: 50px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-size: 1rem;
            background: linear-gradient(135deg, #6fffe0, #a78bfa);
            color: #0a0a0f;
            box-shadow: 0 0 30px rgba(111, 255, 224, 0.15);
            width: fit-content;
        }
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 0 50px rgba(111, 255, 224, 0.25);
        }

        .contact-info {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            justify-content: center;
        }
        .contact-info h3 {
            color: #6fffe0;
            font-size: 1.3rem;
            margin-bottom: 0.5rem;
        }
        .info-item {
            display: flex;
            align-items: center;
            gap: 1rem;
            color: #b6c8e0;
        }
        .info-item i {
            font-size: 1.5rem;
            color: #6fffe0;
            width: 2rem;
        }

        .footer {
            margin-top: 3rem;
            padding-top: 2rem;
            border-top: 1px solid rgba(111, 255, 224, 0.06);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }
        .footer p { color: rgba(255,255,255,0.2); font-size: 0.9rem; }
        .social a {
            color: rgba(255,255,255,0.2);
            font-size: 1.2rem;
            margin-left: 1.5rem;
            transition: 0.3s;
        }
        .social a:hover { color: #6fffe0; transform: translateY(-3px); }

        @media (max-width: 768px) {
            .container { padding: 1rem; }
            .header { flex-direction: column; gap: 1rem; padding: 1rem; }
            .nav a { margin: 0 0.8rem; font-size: 0.85rem; }
            .page-title { font-size: 2rem; }
            .contact-grid { grid-template-columns: 1fr; }
        }
        @media (max-width: 480px) {
            .page-title { font-size: 1.5rem; }
            .footer { flex-direction: column; text-align: center; }
            .social a { margin: 0 0.8rem; }
        }
    </style>
</head>
<body>

    <div class="bg-animation"></div>
    <div class="stars" id="stars"></div>

    <div class="container">

        <header class="header">
            <div class="logo">
                <img src="assets/images/npx-logo.svg" alt="NPX" />
                <span>NIGHT PULSE X</span>
            </div>
            <nav class="nav">
                <a href="index.html"><i class="fas fa-house"></i> Home</a>
                <a href="about.html"><i class="fas fa-user-astronaut"></i> About</a>
                <a href="writeups.html"><i class="fas fa-pen-fancy"></i> Writeups</a>
                <a href="certifications.html"><i class="fas fa-certificate"></i> Certs</a>
                <a href="contact.html" class="active"><i class="fas fa-envelope"></i> Contact</a>
            </nav>
        </header>

        <h1 class="page-title"><i class="fas fa-envelope"></i> Contact Me</h1>

        <div class="contact-grid">
            <form class="contact-form" id="contactForm">
                <input type="text" placeholder="Full Name" required />
                <input type="email" placeholder="Email Address" required />
                <input type="text" placeholder="Subject" />
                <textarea placeholder="Your message..." rows="5" required></textarea>
                <button type="submit" class="btn"><i class="fas fa-paper-plane"></i> Send</button>
            </form>

            <div class="contact-info">
                <h3>Connect With Me</h3>
                <div class="info-item">
                    <i class="fas fa-envelope"></i>
                    <span>contact@nightpulsex.com</span>
                </div>
                <div class="info-item">
                    <i class="fab fa-github"></i>
                    <span>github.com/npx-official</span>
                </div>
                <div class="info-item">
                    <i class="fas fa-shield-halved"></i>
                    <span>HTB: /users/2207141</span>
                </div>
                <div class="info-item">
                    <i class="fas fa-user-secret"></i>
                    <span>THM: /p/npx.off</span>
                </div>
                <div class="info-item">
                    <i class="fab fa-linkedin"></i>
                    <span>linkedin.com/in/night-pulse-x</span>
                </div>
            </div>
        </div>

        <footer class="footer">
            <p><i class="fas fa-circle" style="color: #6fffe0; font-size: 0.5rem;"></i> 2026 · NIGHT PULSE X</p>
            <div class="social">
                <a href="https://github.com/npx-official" target="_blank"><i class="fab fa-github"></i></a>
                <a href="https://app.hackthebox.com/users/2207141" target="_blank"><i class="fas fa-shield-halved"></i></a>
                <a href="https://tryhackme.com/p/npx.off" target="_blank"><i class="fas fa-user-secret"></i></a>
                <a href="https://www.linkedin.com/in/night-pulse-x-337a89275" target="_blank"><i class="fab fa-linkedin"></i></a>
            </div>
        </footer>

    </div>

    <script>
        (function() {
            const container = document.getElementById('stars');
            for (let i = 0; i < 80; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                const size = Math.random() * 3 + 1;
                star.style.width = size + 'px';
                star.style.height = size + 'px';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.setProperty('--d', (2 + Math.random() * 4) + 's');
                star.style.animationDelay = (Math.random() * 5) + 's';
                star.style.opacity = Math.random() * 0.5 + 0.2;
                container.appendChild(star);
            }
        })();

        // Contact form
        document.getElementById('contactForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const btn = this.querySelector('button');
            const original = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Sending...';
            btn.disabled = true;
            setTimeout(() => {
                btn.innerHTML = '<i class="fas fa-check"></i> Sent!';
                setTimeout(() => {
                    btn.innerHTML = original;
                    btn.disabled = false;
                    this.reset();
                }, 2000);
            }, 2000);
        });
    </script>

<!-- Mouse effects -->
<div class="mouse-trail" id="mouseTrail"></div>
<div class="mouse-glow-effect" id="mouseGlowEffect"></div>

<style>
.mouse-trail { position: fixed; width: 8px; height: 8px; background: #6fffe0; border-radius: 50%; pointer-events: none; z-index: 9999; box-shadow: 0 0 20px rgba(111,255,224,0.5), 0 0 60px rgba(111,255,224,0.2); transform: translate(-50%, -50%); transition: width 0.2s, height 0.2s; }
.mouse-glow-effect { position: fixed; width: 200px; height: 200px; background: radial-gradient(circle, rgba(111,255,224,0.06), transparent 70%); border-radius: 50%; pointer-events: none; z-index: 9998; transform: translate(-50%, -50%); transition: width 0.3s, height 0.3s; }
.mouse-glow-effect.active { width: 350px; height: 350px; background: radial-gradient(circle, rgba(111,255,224,0.12), transparent 70%); }
</style>

<script>
(function() { const trail = document.getElementById("mouseTrail"); const glow = document.getElementById("mouseGlowEffect"); let x = 0, y = 0; let trailX = 0, trailY = 0; document.addEventListener("mousemove", (e) => { x = e.clientX; y = e.clientY; glow.style.left = x + "px"; glow.style.top = y + "px"; glow.classList.add("active"); clearTimeout(window.glowTimeout); window.glowTimeout = setTimeout(() => glow.classList.remove("active"), 200); }); setInterval(() => { trailX += (x - trailX) * 0.15; trailY += (y - trailY) * 0.15; trail.style.left = trailX + "px"; trail.style.top = trailY + "px"; }, 16); document.addEventListener("mouseleave", () => { trail.style.opacity = "0"; glow.style.opacity = "0"; }); document.addEventListener("mouseenter", () => { trail.style.opacity = "1"; glow.style.opacity = "1"; }); })();
</script>

</body>
</html>
