        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {

            color: #e0e5f0;
            font-family: 'Segoe UI', system-ui, sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
        }
        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            background: 
                radial-gradient(ellipse at 20% 50%, rgba(111, 255, 224, 0.05), transparent 50%),
                radial-gradient(ellipse at 80% 50%, rgba(124, 58, 237, 0.05), transparent 50%);
            animation: bgMove 10s ease-in-out infinite alternate;
        }
        @keyframes bgMove {
            0% { transform: scale(1) rotate(0deg); }
            100% { transform: scale(1.1) rotate(3deg); }
        }
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }
        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle var(--d) ease-in-out infinite alternate;
        }
        @keyframes twinkle {
            0% { opacity: 0.1; transform: scale(0.5); }
            100% { opacity: 1; transform: scale(1.5); }
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem 3rem;
            position: relative;
            z-index: 1;
        }
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1rem 2rem;
            background: rgba(10, 10, 15, 0.6);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(111, 255, 224, 0.08);
            border-radius: 2rem;
            margin-bottom: 4rem;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #6fffe0, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .logo img { width: 40px; height: 40px; }
        .nav a {
            color: rgba(255,255,255,0.5);
            text-decoration: none;
            margin-left: 2rem;
            font-size: 0.95rem;
            transition: 0.3s;
            position: relative;
        }
        .nav a::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 0;
            width: 0;
            height: 2px;
            background: #6fffe0;
            transition: 0.3s;
        }
        .nav a:hover { color: #fff; }
        .nav a:hover::after { width: 100%; }
        .nav a.active { color: #fff; }
        .nav a.active::after { width: 100%; }
        .nav a i { margin-right: 6px; }

        .page-title {
            font-size: 2.8rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 2.5rem;
            background: linear-gradient(135deg, #6fffe0, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        .social-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            max-width: 800px;
            margin: 0 auto;
        }
        .social-card {
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(111, 255, 224, 0.06);
            border-radius: 1.5rem;
            padding: 2rem 1.5rem;
            text-align: center;
            transition: all 0.3s ease;
            text-decoration: none;
            color: #b6c8e0;
            display: block;
        }
        .social-card:hover {
            transform: translateY(-6px);
            border-color: #6fffe0;
            box-shadow: 0 10px 40px rgba(0,0,0,0.4);
            background: rgba(111, 255, 224, 0.02);
        }
        .social-card i {
            font-size: 2.5rem;
            color: #6fffe0;
            margin-bottom: 0.8rem;
            display: block;
        }
        .social-card h4 {
            color: #e0e5f0;
            font-size: 1.1rem;
            margin-bottom: 0.3rem;
        }
        .social-card p {
            color: rgba(255,255,255,0.4);
            font-size: 0.85rem;
        }

        .footer {
            margin-top: 3rem;
            padding-top: 2rem;
            border-top: 1px solid rgba(111, 255, 224, 0.06);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }
        .footer p { color: rgba(255,255,255,0.2); font-size: 0.9rem; }
        .social {

            gap: 1.5rem;
        }
        .social a {
            color: rgba(255,255,255,0.2);
            font-size: 1.2rem;
            transition: 0.3s;
        }
        .social a:hover { color: #6fffe0; transform: translateY(-3px); }

        @media (max-width: 768px) {
            .container { padding: 1rem; }
            .header { flex-direction: column; gap: 1rem; padding: 1rem; }
            .nav a { margin: 0 0.8rem; font-size: 0.85rem; }
            .page-title { font-size: 2rem; }
        }
        @media (max-width: 480px) {
            .page-title { font-size: 1.5rem; }
            .footer { flex-direction: column; text-align: center; }
        }
    </style>
</head>

    <script>
        (function() {
            const container = document.getElementById('stars');
            for (let i = 0; i < 80; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                const size = Math.random() * 3 + 1;
                star.style.width = size + 'px';
                star.style.height = size + 'px';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.setProperty('--d', (2 + Math.random() * 4) + 's');
                star.style.animationDelay = (Math.random() * 5) + 's';
                star.style.opacity = Math.random() * 0.5 + 0.2;
                container.appendChild(star);
            }
        })();
    </script>

    <!-- Mouse effects -->
    <div class="mouse-trail" id="mouseTrail"></div>
    <div class="mouse-glow-effect" id="mouseGlowEffect"></div>

    <style>
        .mouse-trail { position: fixed; width: 8px; height: 8px; background: #6fffe0; border-radius: 50%; pointer-events: none; z-index: 9999; box-shadow: 0 0 20px rgba(111,255,224,0.5), 0 0 60px rgba(111,255,224,0.2); transform: translate(-50%, -50%); transition: width 0.2s, height 0.2s; }
        .mouse-glow-effect { position: fixed; width: 200px; height: 200px; background: radial-gradient(circle, rgba(111,255,224,0.06), transparent 70%); border-radius: 50%; pointer-events: none; z-index: 9998; transform: translate(-50%, -50%); transition: width 0.3s, height 0.3s; }
        .mouse-glow-effect.active { width: 350px; height: 350px; background: radial-gradient(circle, rgba(111,255,224,0.12), transparent 70%); }
    </style>

    <script>
        (function() {
            const trail = document.getElementById("mouseTrail");
            const glow = document.getElementById("mouseGlowEffect");
            let x = 0, y = 0;
            let trailX = 0, trailY = 0;

            document.addEventListener("mousemove", (e) => {
                x = e.clientX;
                y = e.clientY;
                glow.style.left = x + "px";
                glow.style.top = y + "px";
                glow.classList.add("active");
                clearTimeout(window.glowTimeout);
                window.glowTimeout = setTimeout(() => glow.classList.remove("active"), 200);
            });

            setInterval(() => {
                trailX += (x - trailX) * 0.15;
                trailY += (y - trailY) * 0.15;
                trail.style.left = trailX + "px";
                trail.style.top = trailY + "px";
            }, 16);

            document.addEventListener("mouseleave", () => {
                trail.style.opacity = "0";
                glow.style.opacity = "0";
            });
            document.addEventListener("mouseenter", () => {
                trail.style.opacity = "1";
                glow.style.opacity = "1";
            });
        })();
    </script>
