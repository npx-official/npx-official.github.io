       <!-- إصلاح التوجيه للصفحات المباشرة -->
    <script>
        // إذا كان المسار لا ينتهي بـ .html ولا يحتوي على نقطة، أعد التوجيه إلى index.html
        (function() {
            const path = window.location.pathname;
            if (!path.endsWith('.html') && !path.includes('.') && path !== '/') {
                window.history.replaceState({}, '', '/index.html');
                setTimeout(() => {
                    window.location.reload();
                }, 10);
            }
        })();
    </script>
