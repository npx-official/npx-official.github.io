            align-items: center;
            justify-content: center;
            background: transparent;

            position: relative;
            z-index: 1;
            box-shadow: 0 0 60px rgba(111, 255, 224, 0.05);
            text-align: center;
        }
        .logo-area {

            align-items: center;

        }

            width: 40px;
            height: 40px;

        .logo-area span {
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(135deg, #6fffe0, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 2px;
        }
        .subtitle {
            color: rgba(255,255,255,0.4);

            width: 50px;

            color: rgba(255,255,255,0.2);
            font-size: 18px;
            z-index: 2;

            width: 100%;
            padding: 16px 20px 16px 50px;

            border: 1px solid rgba(111, 255, 224, 0.12);
            border-radius: 12px;
            color: #fff;
            font-size: 16px;
            transition: all 0.3s;
            outline: none;

        .staticrypt-password-container input:focus {
            border-color: #6fffe0;
            box-shadow: 0 0 30px rgba(111, 255, 224, 0.06);
            background: rgba(255,255,255,0.05);
        }
        .staticrypt-password-container input::placeholder {
            color: rgba(255,255,255,0.2);
        }

        .staticrypt-toggle-password-visibility {
            cursor: pointer;
            height: 20px;
            opacity: 60%;
            padding: 13px;
            position: absolute;
            right: 5px;
            top: 50%;
            transform: translateY(-50%);
            width: 20px;
            z-index: 2;
        }

        .options {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 20px 0 25px;
            font-size: 13px;
        }
        .options label {
            color: rgba(255,255,255,0.5);
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }
        .options label input[type="checkbox"] {
            appearance: none;
            width: 16px;
            height: 16px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(111, 255, 224, 0.2);
            border-radius: 4px;
            cursor: pointer;
            position: relative;
            transition: 0.3s;
            flex-shrink: 0;
        }
        .options label input[type="checkbox"]:checked {
            background: #6fffe0;
            border-color: #6fffe0;
        }
        .options label input[type="checkbox"]:checked::after {
            content: '✓';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #0a0a0f;
            font-size: 11px;
            font-weight: bold;
        }
        .options a {
            color: rgba(255,255,255,0.3);
            text-decoration: none;
            transition: 0.3s;
        }
        .options a:hover {
            color: #a78bfa;
        }

            border: none;
            border-radius: 12px;
            color: #0a0a0f;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
        }
        .staticrypt-decrypt-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 40px rgba(111, 255, 224, 0.2);
        }

        .error-msg {
            color: #ff6b6b;
            font-size: 13px;
            margin-top: 15px;
            padding: 12px;
            background: rgba(255, 107, 107, 0.06);
            border: 1px solid rgba(255, 107, 107, 0.12);
            border-radius: 8px;
            display: none;
        }
        .error-msg.show {
            display: block;
            animation: shake 0.4s ease;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            75% { transform: translateX(8px); }
        }

        .footer-text {
            margin-top: 25px;
            color: rgba(255,255,255,0.1);
            font-size: 11px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .footer-text span {
            background: linear-gradient(135deg, #6fffe0, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 600;
        }

        #staticrypt_loading {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .staticrypt-spinner {
            display: inline-block;
            width: 2rem;
            height: 2rem;
            vertical-align: text-bottom;
            border: 0.25em solid #6fffe0;
            border-right-color: transparent;
            border-radius: 50%;
            animation: spinner-border 0.75s linear infinite;
        }
        @keyframes spinner-border {
            100% { transform: rotate(360deg); }

        @media (max-width: 480px) {
            .login-container { padding: 30px 20px; margin: 20px; }
            .logo-area span { font-size: 20px; }
        }
    </style>
</head>
